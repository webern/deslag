name: publish-blobs

# A new batch of the corpus's big tier reaches the registry without anyone's machine. The batch
# is a manifest, scripts/blobstore/batches/NAME.json, that `collect.py pin` wrote. This workflow
# builds every batch whose manifest the pinned image lacks, from nothing, and fails unless each
# comes to exactly what its manifest records; on a push it then publishes them and commits the
# new blobs.lock to the branch pushed. scripts/blobstore/blobs.md has the whole story.
#
# main and m/deslag-exam both publish. A workflow file runs from the branch it is pushed to, so a
# batch can be published from a branch long before it reaches main.
#
# A pull request builds the batches and publishes nothing. That proves a batch can be built again
# from its manifest before the manifest merges.

on:
  push:
    branches: [main, m/deslag-exam]
    paths:
      - scripts/blobstore/batches/*.json
  pull_request:
    paths:
      - scripts/blobstore/batches/*.json
      # What the build is made of, so a change to it runs once, with no manifest to build.
      - scripts/blobstore/batches.sh
      - scripts/llm-detection/collect.py
      - .github/workflows/publish-blobs.yml

permissions:
  contents: read

# Runs on one ref go one at a time. A newer push to a pull request supersedes the run in progress.
# A push to a branch that publishes does not: a run that has begun to publish must finish, and the
# next run starts from the branch as that run left it. Every run builds every manifest the pinned
# image lacks, so one that waited loses nothing.
concurrency:
  group: publish-blobs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Read-only. It clones other people's repositories and reads their Markdown, so it holds no
  # token that can write anything. A batch that cannot be harvested as its manifest pins it fails
  # here, and the job after it never starts.
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    outputs:
      new: ${{ steps.bundle.outputs.new }}
      sha: ${{ steps.checkout.outputs.commit }}
    steps:
      # The branch as it is now, which may be past the commit that started the run, if an earlier
      # run has since committed the lock.
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # The pinned image: what a batch is compared with, and what already holds the batches
      # published before. The package is public; nothing is logged in.
      - name: Fetch the corpus's big tier
        run: make fetch-blobs

      # gh asks GitHub which commits a squash-merged pull request held, with the workflow token.
      - name: Build the batches the manifests name
        env:
          GH_TOKEN: ${{ github.token }}
        run: make build-batches

      - name: Bundle the new batches
        id: bundle
        run: |
          scripts/blobstore/batches.sh bundle "$RUNNER_TEMP/new-batches.tar"
          if [ -f "$RUNNER_TEMP/new-batches.tar" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the new batches for the publish job
        if: github.event_name == 'push' && steps.bundle.outputs.new == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, 2026-04-10
        with:
          name: new-batches
          path: ${{ runner.temp }}/new-batches.tar
          retention-days: 1
          if-no-files-found: error

  # The one job that can write: it runs only for a push, only after harvest, and runs nothing from
  # the batches but the files themselves.
  publish:
    needs: harvest
    if: github.event_name == 'push' && needs.harvest.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      # The commit harvest built against, so the image the batches are added to is the one they
      # were built for. The lock is committed back with the credentials checkout leaves in the
      # clone, and a push that finds the branch moved rebases onto it, which needs the history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20
        with:
          ref: ${{ needs.harvest.outputs.sha }}
          fetch-depth: 0

      # blobs.sh publish builds each new layer with bsdtar.
      - name: Install bsdtar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools

      - name: Fetch the corpus's big tier
        run: make fetch-blobs

      - name: Download the new batches
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, 2026-03-11
        with:
          name: new-batches
          path: ${{ runner.temp }}

      - name: Add the new batches to the tree
        run: scripts/blobstore/batches.sh unbundle "$RUNNER_TEMP/new-batches.tar"

      # blobs.sh logs crane in with this token. The package must grant this repository the Write
      # role, which blobs.md says how to check.
      - name: Publish the image
        env:
          GH_TOKEN: ${{ github.token }}
        run: make publish-blobs

      # The push is made with the workflow token, so it starts no workflow of its own.
      - name: Commit the lock
        run: scripts/blobstore/batches.sh pin-lock "$GITHUB_REF_NAME"
