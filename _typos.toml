# The slop corpus is Markdown quoted from other people's repositories. Its typos are the subject
# matter, not mistakes to fix, and no fixture may be edited to suit a tool. The golden files list
# its fixtures by path, and so quote the names of those repositories and their files.

[files]
extend-exclude = ["tests/corpus", "tests/golden/*.txt"]

# PN is the annotation guide's code for a proper noun, which deslag-gold reads and writes.
# Automattic is the company that holds Harper's copyright, which the licence notices name.
[default.extend-words]
pn = "pn"
Automattic = "Automattic"
