[package]
name = "deslag"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Matthew James Briggs <matthew.james.briggs@gmail.com>"]
description = "A linter that stops Markdown files from growing past their byte budget."
repository = "https://github.com/webern/deslag"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "lint", "linter", "prose", "cli"]
categories = ["development-tools", "command-line-utilities"]
# The published crate holds what a consumer needs to build it and nothing else. A list of what to
# keep, rather than what to drop, so a new file (the test corpus above all) cannot slip in.
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.19"
ignore = "0.4.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"
