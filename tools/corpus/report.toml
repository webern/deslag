# The config `deslag-corpus report` runs the lints at unless given another. It selects every file,
# where the repository's own config selects only the repository's files, and holds that config's
# `[md.lints]` settings, so a lint fails a corpus file as it would fail one of deslag's own. It
# sets no byte budget and no lint that judges a change: a corpus file has no base.

schema_version = 1

[md]
globs = ["*"]

[md.lints.max_emphasis]
free_spans = 2
max_percent = 1

[md.lints.banned_chars]
groups = { emoji = true }

[md.lints.density]
max_paragraph_chars = 500
