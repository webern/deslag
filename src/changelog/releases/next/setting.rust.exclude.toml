kind = "setting"
id = "rust.exclude"
summary = "Leaves files out of [rust] that its globs match"
onboarding = '''
`rust.exclude` lists the files that `rust.globs` match and [rust] leaves out, such as generated
code. A pattern is written as in `globs`: one holding a `/` matches the path from the repo root, one
without matches the file name in any directory. It does not have to end in `.rs`. With no `exclude`,
nothing is left out.

A file that git or a `.ignore` file ignores stays unread, and nothing re-includes a file. An exclude
hides a file from every lint, so only a human adds one: never add one to make a check pass.

```toml
[rust]
globs = ["/src/**/*.rs"]
exclude = ["/src/proto/**"]
```
'''
