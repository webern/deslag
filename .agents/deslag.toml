# deslag's config for its own repository. `make check-deslag` runs it, and `make check` gates CI on
# it. For now it covers the files an agent reads on every session: AGENTS.md and the skills.

schema_version = 1

[md]
globs = ["/AGENTS.md", "/.agents/skills/**/*.md"]

[md.lints.max_emphasis]
free_spans = 2
max_percent = 1

# Every group, including the two that are off by default.
[md.lints.banned_chars]
groups = { quotes = true, emoji = true }

[[md.overrides]]
globs = ["/AGENTS.md"]
lints.max_size_bytes.value = 4000
lints.repo_layout = { min_entries = 5, max_entries = 12 }

[[md.overrides]]
globs = ["/.agents/skills/**/*.md"]
lints.max_size_bytes.value = 5000
