[package]
name = "deslag-corpus"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Loads and measures deslag's test corpus. Never published."
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
deslag = { path = "../.." }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.1.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
