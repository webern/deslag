[package]
name = "deslag"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Matthew James Briggs <matthew.james.briggs@gmail.com>"]
description = "A linter for LLM-authored Markdown."
repository = "https://github.com/webern/deslag"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "lint", "linter", "prose", "cli"]
categories = ["development-tools", "command-line-utilities"]
include = ["/src/**/*.rs", "/src/**/*.md", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.19"
ignore = "0.4.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.1.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"
unicode-segmentation = "1.13.3"

[dev-dependencies]
deslag-corpus = { path = "tools/corpus" }
tempfile = "3.27.0"

[lints]
workspace = true

# tools/corpus measures the test corpus. It is never published, and a path-only dev-dependency is
# dropped from the package, so `cargo publish` sees deslag alone.
[workspace]
members = ["tools/corpus"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
missing_docs = "warn"
