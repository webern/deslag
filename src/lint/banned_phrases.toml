# The phrases `banned_phrases` bans by default, each in one of the groups in `banned_phrases.rs`.
#
# An entry has no `human` file on the corpus's big tier and `llm` files in at least 40
# repositories. Its counts are for the image `measured_on` names, and `make test-blobs` fails when
# they drift; `make fix-catalog` rewrites them and `measured_on`. `since` is the release the entry
# first ships in, or `next` for the unreleased one; tests/changelog.rs holds it to `next` or a
# release no later than the crate version; each release is a directory of src/changelog/releases/.
# A config reports the entry only once its `deslag_version` has reached `since`, so a new phrase
# is `next`, and the change that releases rewrites `next` to the version: `make check-release`
# fails while one is left, since no stamp ever reaches `next`.

measured_on = "ghcr.io/webern/deslag-blobs:v6@sha256:d075cbb39f05adb38eedef319a1bd57a1726c0f7d1ae168c75caea65cc16472a"

