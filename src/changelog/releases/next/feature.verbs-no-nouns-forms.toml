kind = "feature"
id = "verbs-no-nouns-forms"
summary = "verbs_no_nouns also flags past tense and plural verbs, as in `needed no`"
onboarding = """
`verbs_no_nouns` used to fail only a verb ending in `s`, as in `it ships no binary`. It now uses
the tagger's readings to fail the same tic in other forms: `it required no changes`, `these tools
need no setup`, `we found no errors`, `it had no cache`. A new `deslag check` can therefore fail
files that passed before, in a repo that turns the lint on.

Forms of be and do, and `have` itself, are left out; `has` and `had` are not, so `it had no cache`
is flagged and `we have no cache` is not. `have no` is excused because human writers use it about
half as often as agents do, by the share of files that hold it.

Participles are left out, as are forms of verbs such as `mean` and `ensure` whose `no` opens a
clause, and a few idioms: `make no sense`, `look no further`, `read no further` and `pay no
attention`. Nothing is set in the config, and the fix is the same: negate the verb.
"""
