# Values the freeze writes for settings with no schema default; tests/frozen.rs holds it to them.
[[md.allow]]
path = "docs/note.md"
lint = "not_at_all"
quote = "It does not parse at all."
reason = "A frozen config sets every setting."

[md.lints.not_at_all]
message = "{path} pads a negation"

[md.lints.verbs_nothing]
message = "{path} hides the noun"

[[rust.allow]]
path = "src/lib.rs"
lint = "not_at_all"
quote = "It does not parse at all."
reason = "A frozen config sets every setting."

[rust.lints.not_at_all]

[rust.lints.verbs_nothing]
message = "{path} hides the noun"

[[cpp.allow]]
path = "src/a.c"
lint = "not_at_all"
quote = "It does not parse at all."
reason = "A frozen config sets every setting."

[cpp.lints.not_at_all]

[cpp.lints.verbs_nothing]
message = "{path} hides the noun"

[[toml.allow]]
path = "Cargo.toml"
lint = "not_at_all"
quote = "It does not parse at all."
reason = "A frozen config sets every setting."

[toml.lints.not_at_all]

[toml.lints.verbs_nothing]
message = "{path} hides the noun"
