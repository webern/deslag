kind = "setting"
id = "rust.globs"
summary = "Chooses the Rust files the lints judge"
onboarding = '''
`rust.globs` lists the Rust files the lints judge. Every pattern must end in `.rs`. A pattern
holding a `/` matches the path from the repo root; one without matches the file name in any
directory. With no `globs`, every `*.rs` file is judged.

```toml
[rust]
globs = ["/src/**/*.rs"]
```
'''
