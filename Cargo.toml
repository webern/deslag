[package]
name = "deslag"
version = "0.0.5"
edition.workspace = true
rust-version.workspace = true
authors = ["Matthew James Briggs <matthew.james.briggs@gmail.com>"]
description = "A linter for LLM-authored prose."
repository = "https://github.com/webern/deslag"
license = "MIT AND CC-BY-SA-4.0"
readme = "README.md"
keywords = ["markdown", "lint", "linter", "prose", "cli"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "/src/**/*.rs", "/src/**/*.md", "/src/**/*.toml", "/src/**/*.txt", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md",
    # The notices of the sources of src/tag/lexicon.txt, which each source requires on every copy,
    # of the rustc_lexer number lexing ported into src/document/rust.rs, and the licence of
    # src/tag/weights.txt, the weights trained on the English Web Treebank's annotations, which is
    # CC BY-SA 4.0 and so is the reason for the `AND` in `license`, with the attribution of the
    # silver batch's CC BY 4.0 sources it was also trained on.
    "/LICENSES/AGID.txt", "/LICENSES/Moby.txt", "/LICENSES/SCOWL.txt", "/LICENSES/WordNet.txt",
    "/LICENSES/MIT-rustc.txt", "/LICENSES/CC-BY-SA-4.0.txt", "/LICENSES/CC-BY-4.0.txt",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.19"
ignore = "0.4.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
schemars = "1.2.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.1.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"
toml_edit = "0.25.16"
toml_parser = "1.1.4"
# tools/sweep pins unicode-ident to =1.0.24, so keep this requirement one that 1.0.24 meets.
unicode-ident = "1.0.24"
unicode-segmentation = "1.13.3"

[dev-dependencies]
deslag-corpus = { path = "tools/corpus" }
deslag-release = { path = "tools/release" }
tempfile = "3.27.0"

[lints]
workspace = true

# The product tests that spawn deslag per case or build a repository per test, as one binary.
# `make test-product` runs them; `cargo test -p deslag` does not.
[[test]]
name = "slow"
path = "tests/slow/main.rs"
test = false

# tools/corpus measures the test corpus, tools/exam grades taggers and tools/release makes the
# release change. None is published, and deslag does not depend on one, so `cargo publish` sees
# deslag alone. (tools/corpus and tools/release are path-only dev-dependencies, which the package
# drops.)
# tools/sweep is excluded: it needs a newer Rust and a C compiler, and keeps its own lockfile.
[workspace]
members = ["tools/corpus", "tools/exam", "tools/release"]
exclude = ["tools/sweep"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
missing_docs = "warn"

# The tests of `make ci-fast`: the dev profile, debug assertions included, with enough
# optimisation that tagging the corpus takes seconds, not a minute. Built in target/fast.
[profile.fast]
inherits = "dev"
opt-level = 1

# sha2 checks each fixture of the corpus against its sidecar. In a debug build that was 9.4 s of
# the 24 s that loading the big tier took. Only `deslag-corpus` and the tests use it: `deslag`
# does not depend on it (`cargo tree -p deslag -i sha2 -e normal,build` does not print a path).
[profile.dev.package.sha2]
opt-level = 3
