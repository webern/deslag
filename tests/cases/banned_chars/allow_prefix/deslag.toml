schema_version = 2

[md.lints.banned_chars]

[md.lints.banned_chars.groups]
dashes = true
arrows = true
ellipsis = true
bullets = true
math = true
checks = true
section = true
box_drawing = true
spaces = true
invisible = true
quotes = true

[[md.allow]]
path = "README.md"
lint = "banned_chars"
quote = "The first release shipped — it took a long time"
reason = "A quoted title; the quote stops before the end of its sentence."

[[md.allow]]
path = "README.md"
lint = "banned_chars"
quote = "it took a long time, and nobody"
reason = "A quoted title; the quote is the middle of its sentence."
