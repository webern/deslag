kind = "setting"
id = "rust.surfaces"
summary = "Chooses which comments of a Rust file the lints read"
onboarding = '''
`rust.surfaces` lists the kinds of comment to read: `doc_comment` for `///`, `//!`, `/** */` and
`/*! */`, read as Markdown, and `comment` for the other `//` and `/* */` comments, read as plain
text. With no `surfaces`, both are read.

```toml
[rust]
surfaces = ["doc_comment"]
```
'''
