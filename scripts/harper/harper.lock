# The pinned Harper part-of-speech model, which the exam grades as a study-only candidate.
# fetch.sh reads this file, downloads each file named below from <base>/<commit>/<path>, checks its
# sha256, and keeps a copy of this file as .harper/stamp. Change a line here and the next fetch
# starts over.
#
# The code that reads the model is Apache-2.0 and is reimplemented in tools/exam/src/harper.rs. The
# model is not ours to ship: Harper trained it on the train splits of UD English GUM, EWT and
# LinES (CC BY-NC-SA 4.0 and CC BY-SA 4.0). It is for measuring only, so trains = no, and it is
# never checked in, packaged or linked into deslag.
