# The slop corpus is Markdown quoted from other people's repositories. Its typos are the subject
# matter, not mistakes to fix, and no fixture may be edited to suit a tool. The golden files list
# its fixtures by path, and so quote the names of those repositories and their files. The tagger's
# lexicon is generated from word lists, which hold misspellings and rare words by design, and the
# notices of its sources are copied unchanged. A review queue quotes corpus sentences, and so does
# the owner's file once they are moved there, and so does the committed silver batch that the
# check's unit test reads. The hashes of the frozen configs are hex, and a pair of their letters,
# such as `ba`, reads as a typo: whether a release's lines pass would be down to chance.

[files]
extend-exclude = [
    "tests/corpus",
    "tests/gold/queue",
    "tests/gold/owner.conllu",
    "tools/exam/tests/silver-fixture",
    "tests/golden/*.txt",
    "tests/configs/hashes",
    "src/tag/lexicon.txt",
    "LICENSES/AGID.txt",
    "LICENSES/Moby.txt",
    "LICENSES/SCOWL.txt",
    "LICENSES/WordNet.txt",
]

# PN is the annotation guide's code for a proper noun, which deslag-gold reads and writes.
# mis is the prefix in the annotation guide's list of prefixes, which is copied unchanged.
# Automattic is the company that holds Harper's copyright, which the licence notices name.
# ment, ful and nd are word endings, the ones src/tag/shape.rs reads a word's kind from.
[default.extend-words]
pn = "pn"
mis = "mis"
Automattic = "Automattic"
ment = "ment"
ful = "ful"
nd = "nd"
