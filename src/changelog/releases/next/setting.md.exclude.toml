kind = "setting"
id = "md.exclude"
summary = "Leaves files out of [md] that its globs match"
onboarding = '''
`md.exclude` lists the files that `md.globs` match and [md] leaves out, such as generated code. A
pattern is written as in `globs`: one holding a `/` matches the path from the repo root, one without
matches the file name in any directory. It does not have to end in an extension. With no `exclude`,
nothing is left out.

A file that git or a `.ignore` file ignores stays unread, and nothing re-includes a file. An exclude
hides a file from every lint, so only a human adds one: never add one to make a check pass.

```toml
[md]
exclude = ["/docs/adr/**"]
```
'''
