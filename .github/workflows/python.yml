name: python

# make test-python takes minutes of git, so it runs only when the scripts it tests, the deslag-gold
# they run (tools/exam, and what it builds with), or how it is run, change. make ci leaves it out;
# the release runs it beside make ci.
on:
  push:
    branches: [main]
    paths:
      - "scripts/blobstore/**"
      - "scripts/label/**"
      - "scripts/llm-detection/**"
      - "scripts/train/**"
      - "scripts/preflight.sh"
      - "tools/exam/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "scripts/blobstore/**"
      - "scripts/label/**"
      - "scripts/llm-detection/**"
      - "scripts/train/**"
      - "scripts/preflight.sh"
      - "tools/exam/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/python.yml"

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-python:
    strategy:
      fail-fast: false
      matrix:
        # collect.py starts its workers afresh on macOS, and on Linux from Python 3.14.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20

      # test-python builds deslag-gold, so it needs the toolchain rust-toolchain.toml names, and
      # the registry and target dir cached, as in ci.yml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0, 2026-09-18

      # make preflight runs first here as in every gate, and it checks for typos, which this job
      # does not otherwise use. Keep it: it is how a machine learns what it lacks.
      - name: Install typos
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.13, 2026-09-15
        with:
          tool: typos

      - name: Test the scripts
        run: make test-python
