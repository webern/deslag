# The pinned sources of the open-class lexicon, src/tag/lexicon.txt. generate.sh reads this file,
# downloads each `file` below into .lexicon/dl, checks its sha256, and builds the lexicon from them.
# Nothing in the build, the tests or CI reads .lexicon or runs the generator: the lexicon is checked
# in, and the generator is run by hand when a pin or the size changes.
#
# Every source is shippable, and each one's notice is copied from the download into LICENSES/:
#   SCOWL, version 2020.12.07, Kevin Atkinson: permission notice, MIT-like, with the notices of the
#     lists it was built from (LICENSES/SCOWL.txt). Gives which words are in the lexicon.
#   AGID, version 2016.01.19, Kevin Atkinson: the same permission notice (LICENSES/AGID.txt). Gives
#     the inflected forms of a lemma.
#   WordNet 3.0, Princeton University: the WordNet licence (LICENSES/WordNet.txt). Gives each
#     lemma's parts of speech, its sense counts and the names.
#   Moby Part-of-Speech II, Grady Ward: public domain by the author's grant (LICENSES/Moby.txt).
#     Gives each word's parts of speech in priority order.
# Nothing from a treebank is read: the order of readings comes from these alone.
#
# `size` is SCOWL's size level, the cut of which words go in; generate.sh takes another as its
# argument. Every word of SCOWL at that level or below is in, if a source gives it a reading.
