[package]
name = "deslag"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Matthew James Briggs <matthew.james.briggs@gmail.com>"]
description = "A linter for LLM-authored Markdown."
repository = "https://github.com/webern/deslag"
license = "MIT"
readme = "README.md"
keywords = ["markdown", "lint", "linter", "prose", "cli"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "/src/**/*.rs", "/src/**/*.md", "/src/**/*.toml", "/src/**/*.txt", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md",
    # The notices of the sources of src/tag/lexicon.txt, which each source requires on every copy.
    "/LICENSES/AGID.txt", "/LICENSES/Moby.txt", "/LICENSES/SCOWL.txt", "/LICENSES/WordNet.txt",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.19"
ignore = "0.4.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
schemars = "1.2.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.1.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"
unicode-segmentation = "1.13.3"

[dev-dependencies]
deslag-corpus = { path = "tools/corpus" }
tempfile = "3.27.0"

[lints]
workspace = true

# tools/corpus measures the test corpus and tools/exam grades taggers. Neither is published, and
# deslag depends on neither, so `cargo publish` sees deslag alone. (tools/corpus is a path-only
# dev-dependency, which the package drops.)
[workspace]
members = ["tools/corpus", "tools/exam"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
missing_docs = "warn"

# The tests of `make ci-fast`: the dev profile, debug assertions included, with enough
# optimisation that tagging the corpus takes seconds, not a minute. Built in target/fast.
[profile.fast]
inherits = "dev"
opt-level = 1
