name: python

# make test-python takes minutes of git, so it runs only when the scripts it tests, the deslag-gold
# they run (tools/exam, and what it builds with), the tagger whose golden decisions the train
# scripts check (src/tag), or how it is run, change. make ci leaves it out; the release runs it
# beside make ci.
on:
  push:
    branches: [main]
    paths:
      - "scripts/blobstore/**"
      - "scripts/label/**"
      - "scripts/llm-detection/**"
      - "scripts/train/**"
      - "scripts/preflight.sh"
      - "tools/exam/**"
      - "src/tag/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "scripts/blobstore/**"
      - "scripts/label/**"
      - "scripts/llm-detection/**"
      - "scripts/train/**"
      - "scripts/preflight.sh"
      - "tools/exam/**"
      - "src/tag/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/python.yml"

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-python:
    strategy:
      fail-fast: false
      matrix:
        # collect.py starts its workers afresh on macOS, and on Linux from Python 3.14.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20

      # test-python builds deslag-gold, so it needs the toolchain rust-toolchain.toml names, and
      # the registry and target dir cached, as in ci.yml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0, 2026-09-07

      # The train scripts check the learned tagger's golden decisions, and what Python reads as a
      # letter or a digit follows its Unicode version, so the Python is pinned.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0, 2026-07-20
        with:
          python-version: "3.13"

      # make preflight runs first here as in every gate, and it checks for typos, which this job
      # does not otherwise use. Keep it: it is how a machine learns what it lacks.
      - name: Install typos
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.29, 2026-10-16
        with:
          tool: typos

      - name: Test the scripts
        run: make test-python
