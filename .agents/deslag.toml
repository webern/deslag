# deslag's config for its own repository. `make check-deslag` runs it, and `make check` gates CI on
# it.

schema_version = 1

# ACKNOWLEDGEMENTS.md does not require a byte budget.
[md]
globs = [
  "/AGENTS.md",
  "/tests/AGENTS.md",
  "/tools/AGENTS.md",
  "/ACKNOWLEDGEMENTS.md",
  "/.agents/skills/**/*.md",
  "/docs/design/analysis.md",
  "/docs/design/catalog.md",
  "/docs/design/corpus.md",
  "/docs/design/*.asbuilt.md",
  "/scripts/blobstore/blobs.md",
  "/src/instructions/**/*.md",
]

[md.lints.max_emphasis]
free_spans = 2
max_percent = 1

# Emoji too, which are off by default.
[md.lints.banned_chars]
groups = { emoji = true }

# The phrase groups, on by default.
[md.lints.banned_phrases]

[md.lints.density]
max_paragraph_chars = 500

# A taste lint, off by default: this repo negates the verb, not its object.
[md.lints.verbs_no_nouns]

# A change may not leave the instructions with more list items than they had.
[[md.overrides]]
globs = ["/AGENTS.md"]
lints.max_size_bytes.value = 4000
lints.repo_layout = { min_entries = 5, max_entries = 12 }
lints.list_growth = {}

# The guides under tests/ and tools/ stay a page: a short layout, a few rules, no list that grows.
[[md.overrides]]
globs = ["/tests/AGENTS.md", "/tools/AGENTS.md"]
lints.repo_layout = { min_entries = 5, max_entries = 10 }
lints.list_growth = {}

[[md.overrides]]
globs = ["/tests/AGENTS.md"]
lints.max_size_bytes.value = 1450

[[md.overrides]]
globs = ["/tools/AGENTS.md"]
lints.max_size_bytes.value = 1300

[[md.overrides]]
globs = ["/.agents/skills/**/*.md"]
lints.max_size_bytes.value = 5000

# An override can turn a lint on but not off, so list_growth names the skills it judges, and the
# build doctrine is not among them: the owner authorized its verb list to grow by one on
# 2026-10-03, and its budget is 5000 plus the 92 bytes that item added.
[[md.overrides]]
globs = [
  "/.agents/skills/deslag-commit/SKILL.md",
  "/.agents/skills/deslag-design-docs/SKILL.md",
  "/.agents/skills/deslag-open-pr/SKILL.md",
]
lints.list_growth = {}

[[md.overrides]]
globs = ["/.agents/skills/deslag-build-doctrine/SKILL.md"]
lints.max_size_bytes.value = 5300

[[md.overrides]]
globs = ["/src/instructions/guide.md"]
lints.max_size_bytes.value = 5000

[[md.overrides]]
globs = ["/src/instructions/lints.md", "/src/instructions/lints/*.md"]
lints.max_size_bytes.value = 800

# corpus.asbuilt.md declares its own budget in its frontmatter.
[[md.overrides]]
globs = ["/docs/design/corpus.md"]
lints.max_size_bytes.value = 17408

[[md.overrides]]
globs = ["/docs/design/catalog.md"]
lints.max_size_bytes.value = 3000

[[md.overrides]]
globs = ["/docs/design/analysis.md"]
lints.max_size_bytes.value = 8192

[[md.overrides]]
globs = ["/scripts/blobstore/blobs.md"]
lints.max_size_bytes.value = 8192

# Every *.asbuilt.md declares its budget in its frontmatter, which wins over this. One that does
# not fails at 4 KB instead of going unchecked.
[[md.overrides]]
globs = ["/docs/design/*.asbuilt.md"]
lints.max_size_bytes.value = 4096
