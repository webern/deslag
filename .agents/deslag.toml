# deslag's config for its own repository. `make check-deslag` runs it, and `make check` gates CI on
# it.

schema_version = 2
deslag_version = "0.0.5"

# ACKNOWLEDGEMENTS.md does not require a byte budget.
[md]
globs = [
  "/AGENTS.md",
  "/tests/AGENTS.md",
  "/tools/AGENTS.md",
  "/ACKNOWLEDGEMENTS.md",
  "/.agents/skills/**/*.md",
  "/scripts/blobstore/blobs.md",
  "/src/instructions/**/*.md",
]

[md.lints.max_emphasis]
free_spans = 2
max_percent = 1

# Every character group, emoji among them. A group runs only where it is set true.
[md.lints.banned_chars]

[md.lints.banned_chars.groups]
emoji = true
dashes = true
arrows = true
ellipsis = true
bullets = true
math = true
checks = true
section = true
box_drawing = true
spaces = true
invisible = true
quotes = true

# The phrases this repo bans. Only a phrase in ban fails a file.
[md.lints.banned_phrases]

[md.lints.banned_phrases.ban]
byte-identical = 'say "identical", or name the check that shows it'
"deliberately not" = "say what it does; what it does not do rarely needs saying"
"it lands" = 'say what happens, such as "it is merged" or "it ships"'
"lands on" = 'say what happens, such as "is merged into" or "reaches"'
load-bearing = "say what depends on it"
"never silently" = "say what it does instead, such as the error it reports"
"not silently" = "say what it does instead, such as the error it reports"

[md.lints.density]
max_paragraph_chars = 500

# A taste lint, off by default: this repo negates the verb, not its object.
[md.lints.verbs_no_nouns]

# This repo writes the plain negation, `does not parse`.
[md.lints.not_at_all]

# A taste lint, off by default: this repo names what a verb did not find.
[md.lints.verbs_nothing]

# This repo writes the possessive alone, `the crate's version`.
[md.lints.possessive_own]

[[md.overrides]]
globs = ["/AGENTS.md"]
lints.max_size_bytes.value = 4000
lints.repo_layout = { min_entries = 5, max_entries = 12 }

# The guides under tests/ and tools/ stay a page: a short layout and a few rules.
[[md.overrides]]
globs = ["/tests/AGENTS.md", "/tools/AGENTS.md"]
lints.repo_layout = { min_entries = 5, max_entries = 10 }

[[md.overrides]]
globs = ["/tests/AGENTS.md"]
lints.max_size_bytes.value = 1450

[[md.overrides]]
globs = ["/tools/AGENTS.md"]
lints.max_size_bytes.value = 1300

[[md.overrides]]
globs = ["/.agents/skills/**/*.md"]
lints.max_size_bytes.value = 5000

[[md.overrides]]
globs = ["/.agents/skills/deslag-build-doctrine/SKILL.md"]
lints.max_size_bytes.value = 5300

[[md.overrides]]
globs = ["/.agents/skills/deslag-release/SKILL.md"]
lints.max_size_bytes.value = 5600

[[md.overrides]]
globs = ["/src/instructions/guide.md"]
lints.max_size_bytes.value = 4847

[[md.overrides]]
globs = ["/src/instructions/lints.md", "/src/instructions/lints/*.md"]
lints.max_size_bytes.value = 800

[[md.overrides]]
globs = ["/src/instructions/update.md"]
lints.max_size_bytes.value = 1585

[[md.overrides]]
globs = ["/scripts/blobstore/blobs.md"]
lints.max_size_bytes.value = 8192

# The comments of deslag's source. A comment may not hold the characters and phrases the
# prose of this repo may not.
[rust]
globs = ["/src/**/*.rs"]

[rust.lints.banned_chars]

[rust.lints.banned_chars.groups]
emoji = true
dashes = true
arrows = true
ellipsis = true
bullets = true
math = true
checks = true
section = true
box_drawing = true
spaces = true
invisible = true
quotes = true

[rust.lints.banned_phrases]

[rust.lints.banned_phrases.ban]
byte-identical = 'say "identical", or name the check that shows it'
"deliberately not" = "say what it does; what it does not do rarely needs saying"
"it lands" = 'say what happens, such as "it is merged" or "it ships"'
"lands on" = 'say what happens, such as "is merged into" or "reaches"'
load-bearing = "say what depends on it"
"never silently" = "say what it does instead, such as the error it reports"
"not silently" = "say what it does instead, such as the error it reports"

[rust.lints.verbs_no_nouns]

[rust.lints.not_at_all]

[rust.lints.verbs_nothing]

[rust.lints.possessive_own]

# The comments of deslag's TOML outside tests/, and not the golden files of tools/sweep, which
# the sweep prints. They are held to the same characters and phrases as the Rust comments.
[toml]
globs = [
  "/.agents/deslag.toml",
  "/_typos.toml",
  "/rust-toolchain.toml",
  "**/Cargo.toml",
  "/src/**/*.toml",
  "/tools/corpus/*.toml",
]

[toml.lints.banned_chars.groups]
emoji = true
dashes = true
arrows = true
ellipsis = true
bullets = true
math = true
checks = true
section = true
box_drawing = true
spaces = true
invisible = true
quotes = true

[toml.lints.banned_phrases]

[toml.lints.banned_phrases.ban]
byte-identical = 'say "identical", or name the check that shows it'
"deliberately not" = "say what it does; what it does not do rarely needs saying"
"it lands" = 'say what happens, such as "it is merged" or "it ships"'
"lands on" = 'say what happens, such as "is merged into" or "reaches"'
load-bearing = "say what depends on it"
"never silently" = "say what it does instead, such as the error it reports"
"not silently" = "say what it does instead, such as the error it reports"

[toml.lints.verbs_no_nouns]

[toml.lints.not_at_all]

[toml.lints.verbs_nothing]

[toml.lints.possessive_own]
