# deslag's config for its own repository. `make check-deslag` runs it, and `make check` gates CI on
# it.

schema_version = 1
deslag_version = "0.0.1"

# ACKNOWLEDGEMENTS.md does not require a byte budget.
[md]
globs = [
  "/AGENTS.md",
  "/tests/AGENTS.md",
  "/tools/AGENTS.md",
  "/ACKNOWLEDGEMENTS.md",
  "/.agents/skills/**/*.md",
  "/docs/design/analysis.md",
  "/docs/design/catalog.md",
  "/docs/design/corpus.md",
  "/docs/design/*.asbuilt.md",
  "/scripts/blobstore/blobs.md",
  "/src/instructions/**/*.md",
  "/src/changelog/releases/next/README.md",
]

[md.lints.max_emphasis]
free_spans = 2
max_percent = 1

# Emoji too, which are off by default.
[md.lints.banned_chars]
groups = { emoji = true }

# The phrase groups, on by default.
[md.lints.banned_phrases]

[md.lints.density]
max_paragraph_chars = 500

# A taste lint, off by default: this repo negates the verb, not its object.
[md.lints.verbs_no_nouns]

# A taste lint, off by default: this repo writes the plain negation, `does not parse`.
[md.lints.not_at_all]

# A taste lint, off by default: this repo names a thing and does not count it. An override can turn
# a lint on but not off, so it is on for the files below and not in the section, which would reach
# the *.asbuilt.md docs, which stay as they are until the owner opens a reconciliation, the skills,
# whose wording is the owner's, and ACKNOWLEDGEMENTS.md. The Rust comments are off too. A counted
# sentence that has to stay is exempted below, with its reason.
[[md.overrides]]
globs = [
  "/AGENTS.md",
  "/tests/AGENTS.md",
  "/tools/AGENTS.md",
  "/docs/design/analysis.md",
  "/docs/design/catalog.md",
  "/docs/design/corpus.md",
  "/scripts/blobstore/blobs.md",
  "/src/instructions/**/*.md",
  "/src/changelog/releases/next/README.md",
]
lints.counted_inventory = {}

[[md.allow]]
path = "docs/design/analysis.md"
lint = "counted_inventory"
quote = "On v2 that cap drops 5,901 of 57,304 n-grams."
reason = "A figure measured on v2."

[[md.allow]]
path = "docs/design/analysis.md"
lint = "counted_inventory"
quote = "On v2 the steps leave 57,304, 51,403, 29,133, 6,895, 6,074 and 4,935 n-grams."
reason = "A figure measured on v2."

[[md.allow]]
path = "docs/design/corpus.md"
lint = "counted_inventory"
quote = "The tree, `tests/corpus/`, stays as the build doctrine bounds it: about 400 fixtures of at most 64KB for each collected label, plus `core/`, which is hand-picked."
reason = "The build doctrine's cap on the tree, a limit."

[[md.allow]]
path = "docs/design/corpus.md"
lint = "counted_inventory"
quote = "A commit is taken for one when its body lists two or more commits as GitHub does, in paragraphs that open with `* `, or holds the header `git merge --squash` writes, or ends with a line of nine dashes and then only the trailers GitHub gathers from the squashed commits."
reason = "The exact shape of a line, a format and no tally."

[[md.allow]]
path = "scripts/blobstore/blobs.md"
lint = "counted_inventory"
quote = "`2026-09-27-01`: the 1200 collected fixtures of `tests/corpus/`, 400 each of `human/`, `llm/` and `mixed/`, byte for byte with their sidecars, packed by `collect.py pack`; 12,034,975 bytes."
reason = "A dated record of what one image holds."

[[md.allow]]
path = "scripts/blobstore/blobs.md"
lint = "counted_inventory"
quote = "`2026-09-27-02`: 21,075 fixtures from `collect.py harvest`, 11,473 `human`, 9,003 `llm` and 599 `mixed`, 474 of those with their twin; 203,442,958 bytes."
reason = "A dated record of what one image holds."

[[md.allow]]
path = "scripts/blobstore/blobs.md"
lint = "counted_inventory"
quote = "It excludes 384 of the first's that `recheck` no longer proves; its `repos.jsonl` lists the 3,232 repositories tried, 1,388 of which gave a fixture."
reason = "A dated record of what one image holds."

[[md.allow]]
path = "scripts/blobstore/blobs.md"
lint = "counted_inventory"
quote = "`2026-10-03-01`: licence corrections: 49 fixtures labelled MIT-0 added back as MIT, byte for byte but for `source.license` in the sidecar; those and 16 more whose licence the corpus does not accept or cannot name dropped."
reason = "A dated record of what one image holds."

[[md.allow]]
path = "scripts/blobstore/blobs.md"
lint = "counted_inventory"
quote = "`2026-10-03-02`: 200 `human` fixtures of prose outside software, from four CC0 repositories."
reason = "A dated record of what one image holds."

[[md.allow]]
path = "scripts/blobstore/blobs.md"
lint = "counted_inventory"
quote = "`2026-10-03-03`: licence corrections: 856 exclusions, and 376 fixtures added again."
reason = "A dated record of what one image holds."

[[md.allow]]
path = "scripts/blobstore/blobs.md"
lint = "counted_inventory"
quote = "`2026-10-03-04`: 200 `llm` stories from one Hugging Face dataset whose publisher names each row's model, a label on the basis of `docs/design/corpus.md` section 3, not a history."
reason = "A dated record of what one image holds."

[[md.allow]]
path = "scripts/blobstore/blobs.md"
lint = "counted_inventory"
quote = "`2026-10-08-silver`: 4,794 sentences, 45,836 words; 9.9MB, and a 7.7MB archive."
reason = "A dated record of what one image holds."

# A change may not leave the instructions with more list items than they had.
[[md.overrides]]
globs = ["/AGENTS.md"]
lints.max_size_bytes.value = 4000
lints.repo_layout = { min_entries = 5, max_entries = 12 }
lints.list_growth = {}

# The guides under tests/ and tools/ stay a page: a short layout, a few rules, no list that grows.
[[md.overrides]]
globs = ["/tests/AGENTS.md", "/tools/AGENTS.md"]
lints.repo_layout = { min_entries = 5, max_entries = 10 }
lints.list_growth = {}

[[md.overrides]]
globs = ["/tests/AGENTS.md"]
lints.max_size_bytes.value = 1450

[[md.overrides]]
globs = ["/tools/AGENTS.md"]
lints.max_size_bytes.value = 1300

[[md.overrides]]
globs = ["/.agents/skills/**/*.md"]
lints.max_size_bytes.value = 5000

# An override can turn a lint on but not off, so list_growth names the skills it judges, and the
# build doctrine is not among them: the owner authorized its verb list to grow by one on
# 2026-10-03, and its budget is 5000 plus the 92 bytes that item added.
[[md.overrides]]
globs = [
  "/.agents/skills/deslag-commit/SKILL.md",
  "/.agents/skills/deslag-design-docs/SKILL.md",
  "/.agents/skills/deslag-open-pr/SKILL.md",
]
lints.list_growth = {}

[[md.overrides]]
globs = ["/.agents/skills/deslag-build-doctrine/SKILL.md"]
lints.max_size_bytes.value = 5300

[[md.overrides]]
globs = ["/src/instructions/guide.md"]
lints.max_size_bytes.value = 5065

[[md.overrides]]
globs = ["/src/instructions/lints.md", "/src/instructions/lints/*.md"]
lints.max_size_bytes.value = 800

[[md.overrides]]
globs = ["/src/instructions/update.md"]
lints.max_size_bytes.value = 1472

# corpus.asbuilt.md declares its own budget in its frontmatter.
[[md.overrides]]
globs = ["/docs/design/corpus.md"]
lints.max_size_bytes.value = 17408

[[md.overrides]]
globs = ["/docs/design/catalog.md"]
lints.max_size_bytes.value = 3522

[[md.overrides]]
globs = ["/docs/design/analysis.md"]
lints.max_size_bytes.value = 8192

[[md.overrides]]
globs = ["/scripts/blobstore/blobs.md"]
lints.max_size_bytes.value = 8192

# Every *.asbuilt.md declares its budget in its frontmatter, which wins over this. One that does
# not fails at 4 KB instead of going unchecked.
[[md.overrides]]
globs = ["/docs/design/*.asbuilt.md"]
lints.max_size_bytes.value = 4096

# The comments of deslag's own source. A comment may not hold the characters and phrases the
# prose of this repo may not.
[rust]
globs = ["/src/**/*.rs"]

[rust.lints.banned_chars]
groups = { emoji = true }

[rust.lints.banned_phrases]

[rust.lints.verbs_no_nouns]

[rust.lints.not_at_all]

# The comments of deslag's own TOML outside tests/, and not the golden files of tools/sweep, which
# the sweep prints. They are held to the same characters and phrases as the Rust comments.
[toml]
globs = [
  "/.agents/deslag.toml",
  "/_typos.toml",
  "/rust-toolchain.toml",
  "**/Cargo.toml",
  "/src/**/*.toml",
  "/tools/corpus/*.toml",
]

[toml.lints.banned_chars]
groups = { emoji = true }

[toml.lints.banned_phrases]

[toml.lints.verbs_no_nouns]

[toml.lints.not_at_all]

[toml.lints.counted_inventory]
