[package]
name = "deslag-exam"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Grades part-of-speech taggers against gold sets. Never published."
license = "MIT AND Apache-2.0"
publish = false
default-run = "deslag-exam"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
deslag = { path = "../.." }
deslag-corpus = { path = "../corpus" }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
