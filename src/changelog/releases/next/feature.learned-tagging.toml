kind = "feature"
id = "learned-tagging"
summary = "The tagger chooses among open readings with trained weights"
onboarding = """
Tagging now has a second stage. After the rules read a sentence, a small trained model chooses
among the tags the rules left open for each word, and sets the word's confidence from how clearly
it prefers one. Words the rules were sure of keep their readings.

No command prints the readings, and nothing is set in the config. `verbs_no_nouns` is the first
lint to read them; its own entry says what it now finds.

The binary is about 3.6 MB larger, since the weights are built into it. A run that reads prose
parses them once, which adds about 12 ms to a release build's run and about 0.2 s to a debug
build's.

The weights are under `CC-BY-SA-4.0`, which is why the crate's licence is now
`MIT AND CC-BY-SA-4.0`. `LICENSES/CC-BY-SA-4.0.txt` and `LICENSES/CC-BY-4.0.txt` carry their
attributions, and `src/tag/weights.md` in the source says what they were trained on.
"""
