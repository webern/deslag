# The settings the golden set runs the lints with. tests/golden.rs reads this file as deslag reads
# a config, and each golden file opens with its lint's table, defaults filled in.
#
# Every lint needs a table here, under which some fixtures of the corpus fail and some pass. A
# lint whose table alone turns it on runs at its defaults, so a changed default moves its file.

schema_version = 2

# Fenced code is not read, which keeps the golden files to the Markdown itself.
# tests/slow/corpus.rs runs the default, which reads it, over the same corpus.
[md]
fences.languages = []

# Any budget between the smallest fixture and the largest splits the corpus. This one fails few,
# which keeps the file short: its records barely move, since a fixture's bytes never change.
[md.lints.max_size_bytes]
value = 16384

# The limits deslag holds its own Markdown to.
[md.lints.max_emphasis]
free_spans = 2
max_percent = 1.0

[md.lints.repo_layout]

[md.lints.banned_chars]

[md.lints.banned_chars.groups]
dashes = true
arrows = true
ellipsis = true
bullets = true
math = true
checks = true
section = true
box_drawing = true
spaces = true
invisible = true
quotes = true

# Only a phrase in ban fails a file: the first five, then the catalogue's. The first five run each
# part of the matcher: one word, a row of words, an apostrophe, a hyphen, and a match dropped
# inside an allowed phrase. They are not advice.
[md.lints.banned_phrases]
allow = ["please note that"]

[md.lints.banned_phrases.ban]
comprehensive = "delete it"
"in order to" = "delete it"
"let's" = "delete it"
"note that" = "delete it"
production-ready = "delete it"
byte-identical = 'say "identical", or name the check that shows it'
"deliberately not" = "say what it does; what it does not do rarely needs saying"
"it lands" = 'say what happens, such as "it is merged" or "it ships"'
"lands on" = 'say what happens, such as "is merged into" or "reaches"'
load-bearing = "say what depends on it"
"never silently" = "say what it does instead, such as the error it reports"
"not silently" = "say what it does instead, such as the error it reports"

[md.lints.density]

[md.lints.verbs_no_nouns]

[md.lints.not_at_all]
