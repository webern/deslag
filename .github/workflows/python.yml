name: python

# make test-python takes minutes of git. It runs on every pull request and push to main, with no filter
# on paths: the deslag-gold and deslag-exam its tests run link most of the repository, so a correct
# filter is most of the tree and drifts, as the last one did. The repository is public, so the minutes
# are free, and a run takes less time than ci.yml, beside which it runs. make ci leaves it out; the
# release runs it beside make ci.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-python:
    strategy:
      fail-fast: false
      matrix:
        # collect.py starts its workers afresh on macOS, and on Linux from Python 3.14.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20

      # test-python builds deslag-gold, so it needs the toolchain rust-toolchain.toml names, and
      # the registry and target dir cached, as in ci.yml. Only main saves the cache.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.0, 2026-09-07
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # The train scripts check the learned tagger's golden decisions, and what Python reads as a
      # letter or a digit follows its Unicode version, so the Python is pinned.
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0, 2026-07-20
        with:
          python-version: "3.13"

      # make preflight runs first here as in every gate, and it checks for typos, which this job
      # does not otherwise use. Keep it: it is how a machine learns what it lacks.
      - name: Install typos
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.87.29, 2026-10-16
        with:
          tool: typos

      - name: Test the scripts
        run: make CARGO_FLAGS=--locked test-python
