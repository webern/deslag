name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest works once make and scripts/ run under Git Bash; add it
        # when the project has Windows users.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # make ci fetches the corpus's big tier, a package this repository is granted access to; see
    # scripts/blobstore/blobs.md.
    permissions:
      contents: read
      packages: read
    steps:
      # make check-deslag judges the change from origin/main, which needs its history.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20
        with:
          fetch-depth: 0

      # Installs what rust-toolchain.toml names and caches the registry and target dir.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0, 2026-09-18

      # A prebuilt binary; cargo install would take minutes.
      - name: Install typos
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.13, 2026-09-15
        with:
          tool: typos

      # .blobs is the pinned image unpacked, with the stamp that says so, so a hit means
      # fetch-blobs touches nothing. Keyed on the lock, with no restore keys: another image is
      # of no use.
      - name: Cache the corpus's big tier
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, 2026-06-26
        with:
          path: .blobs
          key: blobs-${{ runner.os }}-${{ hashFiles('scripts/blobstore/blobs.lock') }}

      # blobs.sh reads the package with gh's token, which here is the workflow token. make ci is
      # not everything: python.yml runs make test-python when the scripts it tests change.
      - name: CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: make ci
