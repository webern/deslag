schema_version = 2

[md.lints.banned_chars]

[md.lints.banned_chars.groups]
dashes = true
arrows = true
ellipsis = true
bullets = true
math = true
checks = true
section = true
box_drawing = true
spaces = true
invisible = true
quotes = true

[[md.allow]]
path = "README.md"
lint = "banned_chars"
quote = "The title — a dated record."
reason = "A quoted title; a no-break space was added later."
