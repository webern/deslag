# The exam's gates on deslag's own tagger. `deslag-exam gate --gates tests/gold/gates.toml SET...`
# judges each named set: `make test-exam` runs dev, mustpass and holdout, `make test-ewt` runs ewt-dev.
#
# A rate gate is a whole number per mille: min_per_mille = 860 means at least 86.0%. It is judged
# on integer counts, never on a printed percentage: a floor holds when
# numerator * 1000 >= gate * denominator, a ceiling when numerator * 1000 <= gate * denominator.
# A count gate judges the numerator itself. min_tokens leaves a gate unjudged when its denominator
# is smaller. Keys are the report's metric names in lower case, with `_` for spaces and hyphens.
#
# Raise a gate in the change that earns it. Lowering one is a decision its PR must name.

# Ratchets set under tag VERSION 12 (2026-10-11), the rules and the learned stage together: best
# guess 2890/3119, gold retained 2991, committed 2094, accuracy 2052/2094, Sure 1539/1559, Likely
# 513/535, unknown 83, clean 263/296. The best-guess floor rose to just under that count. Accuracy,
# clean sentences and Likely accuracy fell to the shipped tagger's counts: it commits to 600 more
# words than the rules alone did (2094 against 1494), 30 more of them wrong, so those three counts
# fall a word, four sentences and six words short of the floors the rules alone had set.
[dev]
gold = "tests/gold/dev.conllu"
best_guess_accuracy = { min_per_mille = 920 }
gold_retained       = { min_per_mille = 955 }
committed_share     = { min_per_mille = 460 }
accuracy            = { min_per_mille = 979 }
sure_accuracy       = { min_per_mille = 985 }
likely_accuracy     = { min_per_mille = 958, min_tokens = 100 }
unknown_rate        = { max_per_mille = 75 }
clean_sentences     = { min_per_mille = 888 }
unalignable_rate    = { max_count = 0 }

# The words nobody doubts: `list` holds the dev words with Prov=agree that tag VERSION 10 tags right
# at Sure, and a tagger fails the set by missing any of them, whatever its scores.
# The list is frozen at VERSION 10 and never regenerated; the owner decides in the change that fails
# a row whether the row goes. A word passes when the guess is the listed tag at Sure or Likely.
[mustpass]
gold = "tests/gold/dev.conllu"
list = "tests/gold/mustpass.tsv"

# The targets the tagger was built to, never ratcheted: a holdout that moved with every change
# would become a second dev set. Its output is pass or fail per metric, nothing more.
[holdout]
gold = "tests/gold/holdout.conllu"
best_guess_accuracy = { min_per_mille = 850 }
gold_retained       = { min_per_mille = 940 }
committed_share     = { min_per_mille = 430 }
accuracy            = { min_per_mille = 940 }
sure_accuracy       = { min_per_mille = 980 }
likely_accuracy     = { min_per_mille = 900, min_tokens = 100 }
unknown_rate        = { max_per_mille = 85 }
clean_sentences     = { min_per_mille = 700 }
unalignable_rate    = { max_count = 0 }

# The treebank's dev set, outside CI because `make test-ewt` needs the network. These are the
# counts of tag VERSION 10, except that gold retained is the shipped tagger's count (20346, 48 fewer
# than the rules alone kept), and any drop fails. `tokens` pins the scored tokens they are counts of,
# so a new treebank release or a tokenizer change has to re-baseline them by hand.
[ewt-dev]
gold = ".ewt/r2.18/en_ewt-ud-dev.conllu"
tokens = 21149
best_guess_accuracy = { min_count = 18466 }
gold_retained       = { min_count = 20346 }
