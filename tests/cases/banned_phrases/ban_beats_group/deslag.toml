schema_version = 2

[md.lints.banned_phrases]
ban = { "Load-Bearing" = "say which release depends on it", byte-identical = 'say "identical", or name the check that shows it', "deliberately not" = "say what it does; what it does not do rarely needs saying", "it lands" = 'say what happens, such as "it is merged" or "it ships"', "lands on" = 'say what happens, such as "is merged into" or "reaches"', "never silently" = "say what it does instead, such as the error it reports", "not silently" = "say what it does instead, such as the error it reports" }
